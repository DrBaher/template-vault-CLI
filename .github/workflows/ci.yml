name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build-and-install-smoke:
    name: build wheel + pipx install + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install via pipx
        run: |
          python -m pip install --user pipx
          python -m pipx install dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          template-vault --version
          rm -rf /tmp/tv-smoke && mkdir -p /tmp/tv-smoke && cd /tmp/tv-smoke
          template-vault init
          template-vault sources

          # Compose / swap end-to-end against fixture data
          cat > house.md <<'EOF'
          # House NDA

          ## 1. Purpose
          Evaluate a relationship.

          ## 2. Term and Survival
          Two years.
          EOF

          cat > yc.md <<'EOF'
          # YC NDA

          ## 1. Purpose
          Exploring.

          ## 2. Term and Survival
          One year.
          EOF

          template-vault upload house.md --category nda --name house --summary s --non-interactive
          template-vault upload yc.md    --category nda --name yc    --summary s --non-interactive
          template-vault clauses nda/house
          template-vault compose --base nda/house --as nda/house-startup
          template-vault swap nda/house-startup --clause "Term and Survival" --from nda/yc
          template-vault info nda/house-startup
          template-vault doctor
