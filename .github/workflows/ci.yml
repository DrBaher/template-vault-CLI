name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: python -m pip install 'mypy>=1.10'
      - name: Run mypy in strict mode
        run: python -m mypy --strict template_vault_cli.py

  build-and-install-smoke:
    name: build wheel + pipx install + smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install via pipx
        run: |
          python -m pip install --user pipx
          python -m pipx install dist/*.whl
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          template-vault --version
          rm -rf /tmp/tv-smoke && mkdir -p /tmp/tv-smoke && cd /tmp/tv-smoke
          template-vault init
          template-vault sources

          # Compose / swap end-to-end against fixture data
          cat > house.md <<'EOF'
          # House NDA

          ## 1. Purpose
          Evaluate a relationship.

          ## 2. Term and Survival
          Two years.
          EOF

          cat > yc.md <<'EOF'
          # YC NDA

          ## 1. Purpose
          Exploring.

          ## 2. Term and Survival
          One year.
          EOF

          template-vault upload house.md --category nda --name house --summary s --non-interactive
          template-vault upload yc.md    --category nda --name yc    --summary s --non-interactive
          template-vault clauses nda/house
          template-vault compose --base nda/house --as nda/house-startup
          template-vault swap nda/house-startup --clause "Term and Survival" --from nda/yc
          template-vault info nda/house-startup
          template-vault doctor

  security:
    name: bandit (medium+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install bandit
      - name: Bandit (medium+ severity)
        # Low findings (B404/B603/B607 subprocess, B101 assert) are expected
        # noise for a stdlib CLI that shells out to git; gate on medium+.
        run: python -m bandit -q -r template_vault_cli.py --severity-level medium
