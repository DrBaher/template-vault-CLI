name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: read-only by default. Only the publish job below
# escalates to id-token:write (the OIDC token for Trusted Publishing),
# so the build job that runs untrusted-ish build code never holds it.
permissions:
  contents: read

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # GitHub environment for PyPI Trusted Publishing. Configure once at
    # https://pypi.org/manage/account/publishing/ pointing this repo +
    # workflow + environment to project "template-vault-cli". Then no
    # token needs to be stored as a secret.
    environment:
      name: pypi
      url: https://pypi.org/p/template-vault-cli
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC; no stored token)
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          attestations: true   # PEP 740 build provenance for the published artifacts
