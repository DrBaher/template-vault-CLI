name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: read-only by default. Only the publish job below
# escalates to id-token:write (the OIDC token for Trusted Publishing),
# so the build job that runs untrusted-ish build code never holds it.
permissions:
  contents: read

jobs:
  build:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # GitHub environment for PyPI Trusted Publishing. Configure once at
    # https://pypi.org/manage/account/publishing/ pointing this repo +
    # workflow + environment to project "template-vault-cli". Then no
    # token needs to be stored as a secret.
    environment:
      name: pypi
      url: https://pypi.org/p/template-vault-cli
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC; no stored token)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          attestations: true   # PEP 740 build provenance for the published artifacts
